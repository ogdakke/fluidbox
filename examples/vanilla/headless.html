<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluidbox headless runtime</title>
    <script type="module" src="/headless.ts"></script>
  </head>
  <body>
    <main class="headless-page">
      <h1>Plain JavaScript runtime</h1>
      <div class="headless-grid" aria-label="Headless photo gallery">
        <button type="button" data-photo-id="one">
          <img src="/photo-square.svg" alt="Blue square study" width="320" height="320" />
        </button>
        <button type="button" data-photo-id="two">
          <img src="/photo-portrait.svg" alt="Orange portrait study" width="240" height="360" />
        </button>
      </div>
    </main>
  </body>
</html>
