<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluidbox slides</title>
    <script type="module" src="/fixtures/slides.ts"></script>
  </head>
  <body>
    <main class="lab-page">
      <h1>Slides of your own, drawing the built-in media</h1>
      <div class="media-grid" id="slides" aria-label="Slides gallery"></div>
      <h2>Slides that replace the built-in image</h2>
      <div class="media-grid" id="replaced" aria-label="Replaced gallery"></div>
      <h2>Slides that zoom, report their pose and use their layer</h2>
      <div class="media-grid" id="hooks" aria-label="Hooks gallery"></div>
      <h2>Videos with sources, and one streamed through attach</h2>
      <div class="media-grid" id="videos" aria-label="Videos gallery"></div>
      <div class="media-grid" id="streamed" aria-label="Streamed gallery"></div>
      <h2>Boxes that fill the stage</h2>
      <div class="media-grid" id="filled" aria-label="Filled gallery"></div>
      <div class="media-grid" id="sheeted" aria-label="Filled gallery with a sheet"></div>
    </main>
  </body>
</html>
