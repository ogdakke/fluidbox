<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fluidbox accessibility fixture</title>
    <script type="module" src="/fixtures/a11y.ts"></script>

    <main id="fixture">
      <h1>Accessibility</h1>
      <div class="a11y-triggers" data-test="triggers"></div>

    <div role="status" data-test="live"></div>
    <div data-fluidbox-exempt data-test="exempt"><button type="button">Exempt</button></div>
