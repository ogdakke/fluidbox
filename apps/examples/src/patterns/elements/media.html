<!-- #region example -->
<fluidbox-gallery class="pattern-grid">
  <button
    type="button"
    class="pattern-thumb"
    data-test="trigger"
    data-fluidbox-item-id="fjord-wood"
  >
    <img src="/products/fjord-wood-640.webp" alt="The print in a wood frame" />
  </button>
  <button
    type="button"
    class="pattern-thumb"
    data-test="trigger"
    data-fluidbox-item-id="product-video"
  >
    <img src="https://i.ytimg.com/vi/M7lc1UVf-VE/mqdefault.jpg" alt="How the print is made" />
  </button>
  <button
    type="button"
    class="pattern-thumb"
    data-test="trigger"
    data-fluidbox-item-id="product-spin"
  >
    <img src="/products/spin/fjord-00-thumb.webp" alt="The framed print, all the way round" />
  </button>
  <button
    type="button"
    class="pattern-thumb"
    data-test="trigger"
    data-fluidbox-item-id="product-model"
  >
    <img src="/products/fjord-model-thumb.webp" alt="The framed print in 3D" />
  </button>
</fluidbox-gallery>
<!-- #endregion example -->
