<!-- #region example -->
<fluidbox-gallery>
  <fluidbox-item item-id="product-runner">
    <button slot="trigger" type="button" class="pattern-card" data-test="product">
      <span data-fluidbox-origin>
        <img src="/runner.svg" alt="Illustrated coral running shoe" />
      </span>
      <span>
        <strong>Coral runner</strong><br />
        €120
      </span>
    </button>
    <template slot="content">
      <img src="/runner.svg" alt="Illustrated coral running shoe" width="1000" height="700" />
    </template>
  </fluidbox-item>
</fluidbox-gallery>
