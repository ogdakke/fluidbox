<!-- #region example -->
<fluidbox-gallery class="pattern-grid">
  <!-- Items of type "note" show this in their media box; the rest are built in. -->
  <template data-fluidbox-slide="note">
    <fluidbox-media>
      <article class="pattern-note" data-theme></article>
    </fluidbox-media>
  </template>
  <button type="button" class="pattern-thumb" data-test="trigger" data-fluidbox-value="media-note">
    <img src="/art/meadow.svg" alt="A note" />
  </button>
  <button type="button" class="pattern-thumb" data-test="trigger" data-fluidbox-value="media-map">
    <img src="/map/preview.svg" alt="Helsinki Market Square on OpenStreetMap" />
  </button>
  <button type="button" class="pattern-thumb" data-test="trigger" data-fluidbox-value="media-video">
    <img src="/video/drift-poster.jpg" alt="Drifting clouds" />
  </button>
  <button
    type="button"
    class="pattern-thumb"
    data-test="trigger"
    data-fluidbox-value="media-youtube"
  >
    <img
      src="https://i.ytimg.com/vi/dQw4w9WgXcQ/maxresdefault.jpg"
      alt="Rick Astley - Never Gonna Give You Up"
    />
  </button>
</fluidbox-gallery>
<!-- #endregion example -->
