name: Browser tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run build
      - run: bun run lint:all
      - run: bun run test
      - run: bun run test:bundle
      - run: bun run test:ssr
      - run: bun run build:examples
      - run: bun run build:docs
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: bunx playwright test --shard=${{ matrix.shard }}/8 --reporter=dot,blob
      - name: Index failure videos
        if: failure()
        run: bun run inspect:failures
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-${{ matrix.shard }}
          path: blob-report
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-results-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  merge-reports:
    needs: browser
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: all-blobs
          pattern: blob-*
          merge-multiple: true
      - run: bunx playwright merge-reports --reporter=html,github ./all-blobs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-report
          path: playwright-report
          retention-days: 14

  baseline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run test:browser:baseline
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: current-fluidbox-baseline
          path: |
            test-results/capture
            tests/browser/interactions.spec.ts-snapshots
            playwright-report
            test-results
          retention-days: 30
