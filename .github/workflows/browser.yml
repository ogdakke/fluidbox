name: Browser tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run test:browser
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-results
          path: |
            playwright-report
            test-results
          retention-days: 14

  baseline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run test:browser:baseline
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: current-lightbox-baseline
          path: |
            baseline/current
            playwright-report
            test-results
          retention-days: 30
