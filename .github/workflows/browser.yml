name: Browser tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint:all
      - run: bun run test
      - run: bun run build:example
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: bun run test:browser
      - name: Index failure videos
        if: failure()
        run: bun run inspect:failures
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-results
          path: |
            playwright-report
            test-results
          retention-days: 14

  baseline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run test:browser:baseline
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: current-lightbox-baseline
          path: |
            test-results/capture
            tests/browser/interactions.spec.ts-snapshots
            playwright-report
            test-results
          retention-days: 30
